<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaYoshi DApp Example</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    .container {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    button {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 8px;
      transition: background 0.2s;
    }
    button:hover {
      background: #3a8eef;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      background: #333;
    }
    .success {
      background: #2d5a2d;
      color: #90ee90;
    }
    .error {
      background: #5a2d2d;
      color: #ff6b6b;
    }
    .info {
      background: #2d3a5a;
      color: #90c4ff;
    }
    input {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      margin: 8px 0;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 12px 0 4px 0;
      font-weight: 600;
    }
    .network-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .network-btn {
      background: #444;
      padding: 8px 16px;
      font-size: 14px;
    }
    .network-btn.active {
      background: #4a9eff;
    }
  </style>
</head>
<body>
  <h1>🦖 MetaYoshi Wallet DApp Example</h1>
  
  <div class="container">
    <h2>Connection</h2>
    <div id="connectionStatus" class="status info">Checking MetaYoshi Wallet...</div>
    <button id="connectBtn" disabled>Connect Wallet</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
  </div>
  
  <div class="container">
    <h2>Network</h2>
    <div class="network-selector">
      <button class="network-btn" data-network="rtm">Raptoreum</button>
      <button class="network-btn" data-network="btcz">BitcoinZ</button>
      <button class="network-btn" data-network="firo">Firo</button>
    </div>
    <div id="networkStatus" class="status info">No network selected</div>
  </div>
  
  <div class="container">
    <h2>Account Info</h2>
    <div id="accountInfo" class="status info">Not connected</div>
  </div>
  
  <div class="container">
    <h2>Send Transaction</h2>
    <label>Recipient Address:</label>
    <input type="text" id="toAddress" placeholder="Enter recipient address">
    
    <label>Amount:</label>
    <input type="text" id="amount" placeholder="Enter amount">
    
    <button id="sendBtn" disabled>Send Transaction</button>
    <div id="txStatus" class="status" style="display:none;"></div>
  </div>
  
  <div class="container">
    <h2>Sign Message</h2>
    <label>Message to sign:</label>
    <input type="text" id="message" placeholder="Enter message to sign" value="Hello, MetaYoshi!">
    <button id="signBtn" disabled>Sign Message</button>
    <div id="signStatus" class="status" style="display:none;"></div>
  </div>
  
  <script>
    let currentAccount = null
    let currentNetwork = null
    
    // Check if MetaYoshi is available
    function checkMetaYoshi() {
      const statusDiv = document.getElementById('connectionStatus')
      const connectBtn = document.getElementById('connectBtn')
      
      if (typeof window.metayoshi === 'undefined') {
        statusDiv.textContent = '❌ MetaYoshi Wallet is not installed'
        statusDiv.className = 'status error'
        connectBtn.disabled = true
        return false
      }
      
      statusDiv.textContent = '✅ MetaYoshi Wallet detected!'
      statusDiv.className = 'status success'
      connectBtn.disabled = false
      return true
    }
    
    // Connect wallet
    async function connectWallet() {
      try {
        const accounts = await window.metayoshi.enable()
        if (accounts && accounts.length > 0) {
          currentAccount = accounts[0]
          updateAccountInfo()
          updateUI()
          
          const statusDiv = document.getElementById('connectionStatus')
          statusDiv.textContent = `✅ Connected: ${currentAccount}`
          statusDiv.className = 'status success'
        }
      } catch (error) {
        const statusDiv = document.getElementById('connectionStatus')
        statusDiv.textContent = `❌ Error: ${error.message}`
        statusDiv.className = 'status error'
      }
    }
    
    // Update account info
    async function updateAccountInfo() {
      try {
        const state = await window.metayoshi.request({ 
          method: 'wallet_getProviderState' 
        })
        
        const infoDiv = document.getElementById('accountInfo')
        infoDiv.innerHTML = `
          <strong>Coin:</strong> ${state.coinName || 'N/A'}<br>
          <strong>Symbol:</strong> ${state.coinSymbol || 'N/A'}<br>
          <strong>Network:</strong> ${state.networkLabel || 'N/A'}<br>
          <strong>Chain ID:</strong> ${state.chainId || 'N/A'}<br>
          <strong>Address:</strong> ${state.selectedAddress || 'N/A'}<br>
          <strong>Connected:</strong> ${state.connected ? 'Yes' : 'No'}<br>
          <strong>Unlocked:</strong> ${state.unlocked ? 'Yes' : 'No'}
        `
        infoDiv.className = 'status success'
        
        currentNetwork = state.networkId
        updateNetworkButtons()
      } catch (error) {
        console.error('Failed to get provider state:', error)
      }
    }
    
    // Update network buttons
    function updateNetworkButtons() {
      document.querySelectorAll('.network-btn').forEach(btn => {
        if (btn.dataset.network === currentNetwork) {
          btn.classList.add('active')
        } else {
          btn.classList.remove('active')
        }
      })
    }
    
    // Switch network
    async function switchNetwork(networkId) {
      try {
        await window.metayoshi.switchNetwork(networkId)
        currentNetwork = networkId
        updateNetworkButtons()
        updateAccountInfo()
        
        const statusDiv = document.getElementById('networkStatus')
        statusDiv.textContent = `✅ Switched to ${networkId}`
        statusDiv.className = 'status success'
      } catch (error) {
        const statusDiv = document.getElementById('networkStatus')
        statusDiv.textContent = `❌ Error: ${error.message}`
        statusDiv.className = 'status error'
      }
    }
    
    // Send transaction
    async function sendTransaction() {
      const toAddress = document.getElementById('toAddress').value.trim()
      const amount = document.getElementById('amount').value.trim()
      const txStatusDiv = document.getElementById('txStatus')
      
      if (!toAddress || !amount) {
        txStatusDiv.textContent = '❌ Please enter recipient address and amount'
        txStatusDiv.className = 'status error'
        txStatusDiv.style.display = 'block'
        return
      }
      
      try {
        txStatusDiv.textContent = '⏳ Sending transaction...'
        txStatusDiv.className = 'status info'
        txStatusDiv.style.display = 'block'
        
        const state = await window.metayoshi.request({ 
          method: 'wallet_getProviderState' 
        })
        
        let txHash
        if (state.coinDecimals === 18) {
          // EVM transaction
          const valueHex = '0x' + BigInt(Math.floor(parseFloat(amount) * 1e18)).toString(16)
          txHash = await window.metayoshi.request({
            method: 'wallet_sendTransaction',
            params: {
              to: toAddress,
              value: valueHex
            }
          })
        } else {
          // UTXO transaction
          const valueSats = Math.floor(parseFloat(amount) * 1e8)
          txHash = await window.metayoshi.request({
            method: 'wallet_sendTransaction',
            params: {
              to: toAddress,
              value: valueSats.toString()
            }
          })
        }
        
        txStatusDiv.textContent = `✅ Transaction sent! Hash: ${txHash}`
        txStatusDiv.className = 'status success'
      } catch (error) {
        txStatusDiv.textContent = `❌ Error: ${error.message}`
        txStatusDiv.className = 'status error'
      }
    }
    
    // Sign message
    async function signMessage() {
      const message = document.getElementById('message').value.trim()
      const signStatusDiv = document.getElementById('signStatus')
      
      if (!message) {
        signStatusDiv.textContent = '❌ Please enter a message'
        signStatusDiv.className = 'status error'
        signStatusDiv.style.display = 'block'
        return
      }
      
      try {
        signStatusDiv.textContent = '⏳ Signing message...'
        signStatusDiv.className = 'status info'
        signStatusDiv.style.display = 'block'
        
        const signature = await window.metayoshi.request({
          method: 'wallet_signMessage',
          params: {
            message: message
          }
        })
        
        signStatusDiv.textContent = `✅ Signature: ${signature}`
        signStatusDiv.className = 'status success'
      } catch (error) {
        signStatusDiv.textContent = `❌ Error: ${error.message}`
        signStatusDiv.className = 'status error'
      }
    }
    
    // Update UI state
    function updateUI() {
      const connected = currentAccount !== null
      document.getElementById('connectBtn').disabled = connected
      document.getElementById('disconnectBtn').disabled = !connected
      document.getElementById('sendBtn').disabled = !connected
      document.getElementById('signBtn').disabled = !connected
    }
    
    // Event listeners
    document.getElementById('connectBtn').addEventListener('click', connectWallet)
    document.getElementById('disconnectBtn').addEventListener('click', () => {
      currentAccount = null
      updateUI()
      document.getElementById('connectionStatus').textContent = 'Disconnected'
      document.getElementById('connectionStatus').className = 'status info'
      document.getElementById('accountInfo').textContent = 'Not connected'
      document.getElementById('accountInfo').className = 'status info'
    })
    
    document.querySelectorAll('.network-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchNetwork(btn.dataset.network)
      })
    })
    
    document.getElementById('sendBtn').addEventListener('click', sendTransaction)
    document.getElementById('signBtn').addEventListener('click', signMessage)
    
    // Listen for MetaYoshi events
    if (typeof window.metayoshi !== 'undefined') {
      window.metayoshi.on('accountsChanged', (payload) => {
        if (payload.accounts && payload.accounts.length > 0) {
          currentAccount = payload.accounts[0]
          updateAccountInfo()
          updateUI()
        } else {
          currentAccount = null
          updateUI()
        }
      })
      
      window.metayoshi.on('networkChanged', (payload) => {
        currentNetwork = payload.networkId
        updateNetworkButtons()
        updateAccountInfo()
      })
      
      window.metayoshi.on('lockChanged', (payload) => {
        if (!payload.unlocked) {
          currentAccount = null
          updateUI()
        }
      })
    }
    
    // Initialize
    if (checkMetaYoshi()) {
      // Try to get current state
      setTimeout(async () => {
        try {
          const state = await window.metayoshi.request({ 
            method: 'wallet_getProviderState' 
          })
          if (state.connected && state.accounts.length > 0) {
            currentAccount = state.accounts[0]
            currentNetwork = state.networkId
            updateAccountInfo()
            updateUI()
            updateNetworkButtons()
          }
        } catch (error) {
          console.error('Failed to get initial state:', error)
        }
      }, 500)
    }
  </script>
</body>
</html>
