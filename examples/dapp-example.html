<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MetaYoshi RTM dApp example</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111316; color: #eee; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    fieldset { border: 1px solid #333; border-radius: 8px; margin: 16px 0; padding: 12px 16px; }
    input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 8px; background: #1b1e22; color: #eee; border: 1px solid #333; border-radius: 6px; font-family: monospace; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #f5841f; color: #fff; font-weight: bold; cursor: pointer; }
    pre { background: #1b1e22; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>MetaYoshi RTM dApp example</h1>
  <p>The provider is injected only on allowlisted hosts (by default <code>metayoshi.app</code>).</p>

  <button id="connect">Connect</button>

  <fieldset>
    <legend>Send RTM</legend>
    <input id="rtm-to" placeholder="Recipient R… address" />
    <input id="rtm-amount" placeholder="Amount, e.g. 1.5" />
    <button id="send-rtm">Send RTM</button>
  </fieldset>

  <fieldset>
    <legend>Send asset</legend>
    <input id="asset-id" placeholder="64-character asset ID" />
    <input id="asset-to" placeholder="Recipient R… address" />
    <input id="asset-qty" placeholder="Quantity" />
    <button id="send-asset">Send asset</button>
  </fieldset>

  <pre id="log">Waiting for provider…</pre>

  <script>
    const log = (label, value) => {
      document.getElementById('log').textContent = label + '\n' + JSON.stringify(value, null, 2)
    }
    const value = (id) => document.getElementById(id).value.trim()

    function ready(provider) {
      log('Provider ready', { isMetaYoshi: provider.isMetaYoshi })
      provider.on('accountsChanged', (event) => log('accountsChanged', event))
      provider.on('lockChanged', (event) => log('lockChanged', event))

      const run = (label, call) => call().then((result) => log(label, result)).catch((error) => log(label + ' failed', { code: error.code, message: error.message }))

      document.getElementById('connect').onclick = () => run('Connected', () => provider.connect())
      document.getElementById('send-rtm').onclick = () =>
        run('RTM sent', () => provider.sendTransaction({ to: value('rtm-to'), amount: value('rtm-amount') }))
      document.getElementById('send-asset').onclick = () =>
        run('Asset sent', () => provider.sendAsset({ assetId: value('asset-id'), toAddress: value('asset-to'), qty: value('asset-qty') }))
    }

    if (window.metayoshi) ready(window.metayoshi)
    else window.addEventListener('metayoshi#initialized', () => ready(window.metayoshi), { once: true })
  </script>
</body>
</html>
